name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: Vitest (integration + unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Catch type regressions BEFORE running any tests — a broken type
      # signature usually surfaces here as a clear compiler error instead
      # of a noisy runtime failure deep inside a Vitest assertion.
      - name: TypeScript typecheck (tsc --noEmit)
        run: bunx tsc -p tsconfig.json --noEmit

      # ESLint runs right after typecheck so style + correctness issues
      # (unused vars, no-explicit-any, hook deps, a11y rules, etc.) block
      # the PR before the test suite spins up. Uses the project's `lint`
      # script (`eslint .`) so the same config applies locally and in CI.
      # `--max-warnings=0` promotes any warning to a failure too.
      - name: ESLint
        run: bun run lint -- --max-warnings=0





      # Hard-fail on any regression in the Payments-related integration tests.
      # These are the highest-signal tests for the audit-log <-> Payments flow
      # (replay error banner, back-to-payment link, locked-field tooltips).
      - name: Run Payments integration tests
        run: |
          bunx vitest run \
            src/pages/Payments.replayError.test.tsx \
            src/pages/AuditBackToPayment.e2e.test.tsx \
            src/components/PaymentFormLockedTip.test.tsx \
            --reporter=verbose

      # Run the rest of the suite as a second step so a Payments regression
      # surfaces first in the PR check list, but a failure anywhere still
      # blocks the merge.
      - name: Run full test suite
        run: bun run test -- --reporter=verbose

  playwright:
    name: Playwright (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only runs once a playwright config is committed. Until then this job
    # is skipped cleanly instead of failing the PR.
    if: ${{ hashFiles('playwright.config.ts', 'playwright.config.js', 'playwright.config.mjs') != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Same typecheck + lint gates as the Vitest job so a type or lint
      # regression fails the E2E lane fast, before the (slower) build +
      # browser steps run.
      - name: TypeScript typecheck (tsc --noEmit)
        run: bunx tsc -p tsconfig.json --noEmit

      - name: ESLint
        run: bun run lint -- --max-warnings=0


      - name: Build app
        run: bun run build


      - name: Run Playwright tests
        run: bunx playwright test --reporter=list

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
